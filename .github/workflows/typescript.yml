name: TypeScript

on:
  pull_request:
    paths:
      - "cli/**"
      - "worker/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "worker/**"
      - "shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/typescript.yml"

permissions:
  contents: read

concurrency:
  group: typescript-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Generated types
            command: pnpm --filter jitney-worker types && git diff --exit-code -- worker/worker-configuration.d.ts
          - name: Typecheck
            command: pnpm --filter jitney-worker typecheck
          - name: Formatting
            command: pnpm fmt:check
          - name: Oxlint
            command: pnpm lint
          - name: Knip
            command: pnpm knip
          - name: Deduplicated lockfile
            command: pnpm dedupe --check
          - name: Worker tests
            command: pnpm --filter jitney-worker test
    env:
      GITHUB_WEBHOOK_SECRET: ci-placeholder
      GITHUB_APP_ID: ci-placeholder
      GITHUB_APP_PRIVATE_KEY: ci-placeholder
      JITNEY_UNINSTALL_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}

  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter get-jitney check
