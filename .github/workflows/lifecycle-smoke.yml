name: Lifecycle smoke

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      target_version:
        description: Published get-jitney version. Defaults to latest.
        required: false
        type: string
  workflow_call:
    inputs:
      target_version:
        description: Published get-jitney version.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: lifecycle-smoke
  cancel-in-progress: false

jobs:
  smoke:
    if: vars.JITNEY_SMOKE_DEPLOYMENT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: lifecycle-smoke
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DEPLOYMENT_NAME: ${{ vars.JITNEY_SMOKE_DEPLOYMENT }}
      GH_TOKEN: ${{ secrets.JITNEY_SMOKE_GITHUB_TOKEN }}
      REQUESTED_TARGET_VERSION: ${{ inputs.target_version }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve published target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          version=${REQUESTED_TARGET_VERSION:-$(npm view get-jitney version)}
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Inspect fixture baseline
        id: baseline
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$CLOUDFLARE_API_TOKEN" && -n "$DEPLOYMENT_NAME" && -n "$GH_TOKEN" ]]
          npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney list --json > "$RUNNER_TEMP/baseline.json"
          jq -e --arg name "$DEPLOYMENT_NAME" --arg target "$TARGET_VERSION" '
            (.deployments | type) == "array" and (.deployments | length) == 1 and
            .deployments[0].name == $name and .deployments[0].phase == "active" and
            .deployments[0].health == "ok" and
            (.deployments[0].version | type) == "string" and
            (.deployments[0].version != $target or
              ((.deployments[0].previousVersion | type) == "string" and
                .deployments[0].version != .deployments[0].previousVersion)) and
            (.deployments[0].findings | type) == "array" and (.deployments[0].findings | length) == 0 and
            (.orphans | type) == "array" and (.orphans | length) == 0 and
            (.accountFindings | type) == "array" and (.accountFindings | length) == 0
          ' "$RUNNER_TEMP/baseline.json" > /dev/null
          current=$(jq -r '.deployments[0].version' "$RUNNER_TEMP/baseline.json")
          previous=$(jq -r '.deployments[0].previousVersion' "$RUNNER_TEMP/baseline.json")
          [[ "$current" == "$TARGET_VERSION" ]] && rollback=$previous || rollback=$current
          printf 'rollback_version=%s\n' "$rollback" >> "$GITHUB_OUTPUT"

      - name: Run baseline canary
        run: .github/scripts/run-lifecycle-canary baseline

      - name: Upgrade
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney upgrade "$DEPLOYMENT_NAME"

      - name: Run upgraded canary
        run: .github/scripts/run-lifecycle-canary upgraded

      - name: Roll back
        env:
          ROLLBACK_VERSION: ${{ steps.baseline.outputs.rollback_version }}
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney rollback "$DEPLOYMENT_NAME"
          npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney list --json |
            jq -e --arg name "$DEPLOYMENT_NAME" --arg version "$ROLLBACK_VERSION" \
              '.deployments[0].name == $name and .deployments[0].version == $version' > /dev/null

      - name: Run rolled-back canary
        run: .github/scripts/run-lifecycle-canary rolled-back

      - name: Roll forward
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        run: npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney upgrade "$DEPLOYMENT_NAME"

      - name: Run final canary
        run: .github/scripts/run-lifecycle-canary final

      - name: Verify final fixture
        env:
          TARGET_VERSION: ${{ steps.target.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes --package "get-jitney@$TARGET_VERSION" -- jitney list --json > "$RUNNER_TEMP/final.json"
          jq -e --arg name "$DEPLOYMENT_NAME" --arg version "$TARGET_VERSION" '
            (.deployments | type) == "array" and (.deployments | length) == 1 and
            .deployments[0].name == $name and .deployments[0].phase == "active" and
            .deployments[0].health == "ok" and .deployments[0].version == $version and
            (.deployments[0].findings | type) == "array" and (.deployments[0].findings | length) == 0 and
            (.orphans | type) == "array" and (.orphans | length) == 0 and
            (.accountFindings | type) == "array" and (.accountFindings | length) == 0
          ' "$RUNNER_TEMP/final.json" > /dev/null

      - name: Upload inventories
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: lifecycle-smoke-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/baseline.json
            ${{ runner.temp }}/final.json
          if-no-files-found: warn
          retention-days: 30
