name: Release Please

on:
  push:
    branches: [main]
  # Publishes the current main as a prerelease for the fixture Deployment.
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release_please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  plan:
    needs: release_please
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      ref: ${{ steps.plan.outputs.ref }}
      dist_tag: ${{ steps.plan.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASED: ${{ needs.release_please.outputs.release_created }}
          RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ "$EVENT" == push && "$RELEASED" == true ]]; then
            printf 'publish=true\nversion=%s\nref=%s\ndist_tag=latest\n' "$RELEASE_VERSION" "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == workflow_dispatch && "$REF" == refs/heads/main ]]; then
            IFS=. read -r major minor patch < version.txt
            version="$major.$minor.$((patch + 1))-dev.$RUN_NUMBER"
            printf 'publish=true\nversion=%s\nref=%s\ndist_tag=dev\n' "$version" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo publish=false >> "$GITHUB_OUTPUT"
          fi

  publish_cli:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: npm pkg set version=${{ needs.plan.outputs.version }}
        working-directory: cli
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter get-jitney check
      - name: Pack the tested CLI
        run: pnpm --config.ignore-scripts=true pack --pack-destination "$RUNNER_TEMP"
        working-directory: cli
      - name: Publish with trusted publishing
        run: npm publish "$RUNNER_TEMP/get-jitney-${{ needs.plan.outputs.version }}.tgz" --ignore-scripts --access public --provenance --tag ${{ needs.plan.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ""

  publish_runner_image:
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/lorikarikari/jitney:${{ needs.plan.outputs.version }}
            ${{ needs.plan.outputs.dist_tag == 'latest' && 'ghcr.io/lorikarikari/jitney:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

  lifecycle_smoke:
    needs: [release_please, plan, publish_cli, publish_runner_image]
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/lifecycle-smoke.yml
    with:
      target_version: ${{ needs.release_please.outputs.version }}
